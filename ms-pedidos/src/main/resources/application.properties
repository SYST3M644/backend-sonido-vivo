spring.application.name=pedidos

spring.datasource.url=jdbc:mysql://localhost:3306/pedidosdb?createDatabaseIfNotExist=true

spring.datasource.username=root

spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.port=8084


spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=pedidos:${server.port}
spring.cloud.compatibility-verifier.enabled=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Para que los errores lleguen al frontend con su mensaje (por ejemplo "Ese correo ya esta registrado")
server.error.include-message=always
