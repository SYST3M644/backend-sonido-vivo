spring.application.name=usuarios

spring.datasource.url=jdbc:mysql://localhost:3306/usuariosdb?createDatabaseIfNotExist=true

spring.datasource.username=root

spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.port=8081

app.jwt.secreto=${JWT_SECRET:sonido-vivo-clave-secreta-para-firmar-tokens-2026}
app.jwt.duracion=3600000


spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=usuarios:${server.port}
spring.cloud.compatibility-verifier.enabled=false
